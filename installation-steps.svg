<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1050" viewBox="0 0 1040 1050" role="img" aria-label="Illustrated installation and Open Anyway steps"><defs><style>text{font-family:Arial,sans-serif;fill:#18283e}.title{font-size:27px;font-weight:700}.body{font-size:20px}.muted{font-size:16px;fill:#5d6c80}.white{fill:white}.num{font-size:20px;font-weight:700;fill:white}</style></defs><rect width="1040" height="1050" rx="24" fill="#f1f5fa"/>
<rect x="24" y="24" width="992" height="290" rx="18" fill="white"/><circle cx="65" cy="65" r="21" fill="#2367df"/><text x="59" y="72" class="num">1</text><text x="102" y="74" class="title">Drag to Applications</text><text x="102" y="108" class="body">Open the DMG, then copy the app.</text>
<rect x="200" y="144" width="96" height="96" rx="23" fill="#14284b"/><path d="M215 194h13v-25h12v50h14v-39h12v25h16" fill="none" stroke="#6ad9ff" stroke-width="5"/><text x="157" y="274" class="body">EDR Viewer 2.17.18</text><path d="M405 194h180m-20-17 20 17-20 17" stroke="#2367df" stroke-width="6" fill="none"/><path d="M688 161v-16h43l15 16h73v76H688Z" fill="#8bccf6"/><text x="734" y="215" font-size="45" fill="white">A</text><text x="700" y="274" class="body">Applications</text>
<rect x="24" y="330" width="992" height="168" rx="18" fill="white"/><circle cx="65" cy="371" r="21" fill="#2367df"/><text x="59" y="378" class="num">2</text><text x="102" y="380" class="title">Open the installed app</text><text x="102" y="417" class="body">After copying, eject the DMG. Open from Applications.</text><text x="102" y="456" class="muted">If macOS blocks it, dismiss the warning and continue below.</text>
<rect x="24" y="514" width="992" height="352" rx="18" fill="white"/><circle cx="65" cy="555" r="21" fill="#2367df"/><text x="59" y="562" class="num">3</text><text x="102" y="564" class="title">Allow the first launch</text><text x="102" y="602" class="body">System Settings → Privacy &amp; Security → Security</text>
<rect x="102" y="628" width="836" height="154" rx="13" fill="#f1f3f7" stroke="#d6dee9"/><text x="125" y="663" font-size="19" font-weight="700">Security</text><text x="125" y="704" font-size="17">EDR Viewer was blocked from opening.</text><rect x="736" y="683" width="178" height="44" rx="9" fill="#2367df"/><text x="756" y="711" font-size="18" class="white">Open Anyway</text><path d="M822 761v-23m-8 10 8-10 8 10" stroke="#2367df" stroke-width="4" fill="none"/><text x="102" y="822" class="body">Authenticate if asked, then confirm Open.</text>
<rect x="24" y="882" width="992" height="144" rx="18" fill="#e7effe"/><text x="54" y="925" class="title">Ready to use</text><text x="54" y="962" class="body">Start in Viewer Mode. No license key required.</text><text x="54" y="997" class="muted">Have a key? Open License → I have a license key → Activate.</text></svg>